[profile.default]
src = "src"
out = "out"
libs = ["lib"]

#可以在这里配置remapping
#remappings = [
#    "@openzeppelin/=lib/openzeppelin-contracts/contracts/"
#]

[fmt]
line_length = 200
tab_width = 4
bracket_spacing = true


[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }


